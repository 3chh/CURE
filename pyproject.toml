[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cure-ood"
version = "0.1.0"
description = "CURE: Dynamic Memory Curation via Retroactive Eviction for Test-Time OOD Detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "pyyaml>=6.0",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
extract = ["torchvision>=0.16", "pillow>=10"]
dev = ["pytest>=7", "ruff>=0.4"]
edge = ["faiss-cpu>=1.8"]  # chỉ mục gallery xấp xỉ (vòng 60)

[project.scripts]
cure-ood = "cure_ood.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
src = ["src"]
extend-exclude = ["src/cure_ood/methods/testtime/_official", "src/cure_ood/methods/static/_openood"]  # code chính thức giữ nguyên văn

[tool.ruff.lint.per-file-ignores]
"src/cure_ood/methods/legacy/static/*.py" = ["RUF012"]  # grid/defaults là ClassVar khai báo ở StaticMethod
"tests/test_official_*.py" = ["S102"]  # exec để lấy nguyên văn hàm gốc mà ko import cả gói
