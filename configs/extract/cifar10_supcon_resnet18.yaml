# CIFAR-10, ResNet-18 huấn luyện SupCon (ko phải checkpoint OpenOOD) → configs/benchmarks/cifar10_supcon.yaml
backbone: resnet18_32x32
checkpoint: resnet18_supcon.pt
options: {norm: cifar10}
imglists: cifar10          # $CURE_IMGLISTS/cifar10/*.txt
image_root: images_classic # $CURE_IMAGES/images_classic
output: resnet18_supcon_v15.npz
batch_size: 512
sets:
  id_train: train_cifar10
  id_val: val_cifar10
  val_tin: val_tin
  id_test: test_cifar10
  cifar100: test_cifar100
  tin: test_tin
  mnist: test_mnist
  svhn: test_svhn
  texture: test_texture
  places365: test_places365
