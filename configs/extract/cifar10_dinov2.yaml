# CIFAR-10, DINOv2 ViT-B/14 (CLS, ko logit) → file của configs/benchmarks/cifar10_dinov2.yaml
backbone: dinov2_vitb14
imglists: cifar10
image_root: images_classic
output: dino_cifar10_v15.npz
batch_size: 256
num_workers: 4
seed: 0
sets:
  id_train: train_cifar10
  id_val: val_cifar10
  id_test: test_cifar10
  cifar100: test_cifar100
  tin: test_tin
  # Tập rất lớn: lấy cố định 10k mẫu (rng(seed).permutation) để giữ thời gian chạy.
  mnist: {list: test_mnist, subsample: 10000}
  svhn: {list: test_svhn, subsample: 10000}
  texture: test_texture
  places365: {list: test_places365, subsample: 10000}
