# ResNet-18 32x32 SupCon (Khosla et al., NeurIPS 2020) theo HobbitLong/SupContrast:
#   main_supcon.py + README (batch 1024, lr 0.5, nhiệt độ 0.1, cosine, khởi động 10 epoch từ 0.01 vì batch > 256,
#   wd 1e-4, 1000 epoch, tăng cường RandomResizedCrop/ColorJitter/Grayscale, đầu chiếu MLP 512-512-128),
#   main_linear.py + README (đánh giá tuyến tính: batch 512, lr 5, 100 epoch, giảm 0.2 tại 60/75/90, wd 0).
# Chuẩn hóa dùng thống kê OpenOOD (khác std của SupContrast) để khớp backbone resnet18_32x32 lúc trích.
run: cifar10_resnet18_supcon
seed: 0
amp: true
select: best                # theo val acc của giai đoạn tuyến tính
data:
  imglists: cifar10
  image_root: images_classic
  train: train_cifar10
  val: val_cifar10
  norm: cifar10
  size: 32
  resize: 32
  cache: true
  num_workers: 0
model: {name: resnet18_32x32}
stages:
  - name: supcon
    loss: {name: supcon, temperature: 0.1, base_temperature: 0.07, proj_dim: 128}
    epochs: 1000
    batch_size: 1024
    augment: supcon
    validate: false         # chưa có tầng phân loại
    optimizer: {lr: 0.5, momentum: 0.9, weight_decay: 1.0e-4, nesterov: false}
    schedule: {name: cosine, per: epoch, min_lr: 5.0e-4, warmup_epochs: 10, warmup_from: 0.01}  # min = lr * 0.1^3
  - name: linear
    loss: {name: linear_ce}
    epochs: 100
    batch_size: 512
    augment: linear
    optimizer: {lr: 5.0, momentum: 0.9, weight_decay: 0.0, nesterov: false}
    schedule: {name: step, milestones: [60, 75, 90], gamma: 0.2}
export:
  extract: cifar10_supcon_resnet18
  benchmark: cifar10_supcon
