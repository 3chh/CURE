# Tái hiện bảng chương 7 hiện có (vòng 57): các đối thủ là bản dùng ở vòng 21-57 (chưa trung thành, xem docs/reimplementations).
name: round57
benchmarks: [cifar10, cifar100, imagenet200]
pis: [0.05, 0.2, 0.5]
seeds: [0, 1, 2]
methods:
  # Phương pháp của ta
  cure: {}
  cure_msp: {method: cure, base: msp}
  cure_energy: {method: cure, base: energy}
  cure_lf: {method: cure, certifier: elond, window: 512, wake: [256, 0.05], memory: queue+cdm, rule: fisher, w_mem: 0.1, fallback: false}
  # Test-time có bộ nhớ, nền kNN
  knn: {}
  oodd: {method: oodd_core}
  age_queue: {ttl: 512}
  adaodd: {k: 50, gamma: 5.0, kappa: 1.5}
  warden_a: {method: warden_r53, kappa: 0.5, delta: 0.1}
  warden_b: {method: warden_r53, kappa: 0.1, delta: 0.2}
  warden_c: {method: warden_r53, kappa: 0.05, delta: 0.2}
  rtl_plus: {method: rtl_plus_legacy}
  # Test-time có bộ nhớ, nền MSP/Energy (logit)
  msp: {method: msp_legacy}
  energy: {method: energy_legacy, aps: false}
  dcac_msp: {method: dcac_msp_r53}
  dcac_energy: {method: dcac_energy_r53}
  dynproto: {method: dynproto_r53}
  # Tĩnh, siêu tham số chọn bằng APS khi benchmark có val_ood
  energy_aps: {method: energy_legacy}
  maxlogit: {method: maxlogit_legacy}
  gen: {method: gen_legacy}
  mahalanobis: {method: mahalanobis_legacy}
  vim: {method: vim_legacy}
  react: {method: react_legacy}
  nci: {method: nci_legacy}
  fdbd: {method: fdbd_legacy}
  cadref: {}
output: results
report:
  reference: knn
  select:
    warden_best: [warden_a, warden_b, warden_c]   # chọn theo AUROC test: cận trên lạc quan
  ranking: [knn, oodd, age_queue, adaodd, warden_best, rtl_plus, cure_lf, cure]
  families:
    kNN: {base: knn, method: cure, rivals: [oodd, adaodd, warden_best, rtl_plus, age_queue]}
    MSP: {base: msp, method: cure_msp, rivals: [dcac_msp, dynproto]}
    Energy: {base: energy, method: cure_energy, rivals: [dcac_energy]}
  labels:
    cure: "**CURE**"
    cure_msp: "**CURE[MSP]**"
    cure_energy: "**CURE[Energy]**"
    cure_lf: CURE-LF (earlier version)
    knn: kNN
    oodd: OODD
    age_queue: Age-expiry queue
    adaodd: AdaODD*
    warden_best: WARDEN* (best config on test)
    rtl_plus: RTL++
    msp: MSP
    energy: Energy
    dcac_msp: DCAC-MSP
    dcac_energy: DCAC-Energy
    dynproto: DynProto*
